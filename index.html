<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texas Judicial Ethics Monitor</title>
  <style>
    body { font-family: Georgia, serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #f7f4ef; color: #1c1917; }
    h1 { font-size: 1.6rem; }
    .meta { color: #57534e; font-size: 0.9rem; }
    article { background: #fff; border: 1px solid #e7e5e4; padding: 1rem 1.1rem; margin: 1rem 0; }
    article h2 { font-size: 1.1rem; margin: 0 0 .4rem; }
    a { color: #1e3a5f; }
    .area { font-size: .85rem; letter-spacing: .02em; text-transform: uppercase; color: #7c2d12; }
  </style>
</head>
<body>
  <h1>Texas Judicial Ethics Monitor</h1>
  <p class="meta">Public rolling record. Newest first. Updated <span id="updated"></span>.</p>
  <div id="list">Loading entries.json…</div>
  <script>
    fetch('entries.json').then(r => r.json()).then(d => {
      document.getElementById('updated').textContent = d.updated || '';
      const root = document.getElementById('list');
      root.innerHTML = '';
      (d.items || []).forEach(it => {
        const el = document.createElement('article');
        el.innerHTML = '<div class="area">' + (it.area || '') + ' · ' + (it.date || '') + '</div>'
          + '<h2><a href="' + it.url + '" rel="noopener">' + it.title + '</a></h2>'
          + '<p class="meta">' + (it.source || '') + ' · ' + (it.quality || '') + '</p>'
          + '<p>' + (it.summary || '') + '</p>';
        root.appendChild(el);
      });
    }).catch(e => { document.getElementById('list').textContent = 'Could not load entries.json'; });
  </script>
</body>
</html>
